<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1680" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2E8"/>
      <stop offset="1" stop-color="#F4F8F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2F6B57"/>
    </marker>
  </defs>
  <rect width="1680" height="980" fill="url(#bg)"/>
  <text x="80" y="88" fill="#17332D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Luồng tương tác chính của WingsTravel</text>
  <text x="80" y="128" fill="#5B6D69" font-family="Segoe UI, Arial, sans-serif" font-size="20">Sơ đồ này mô tả cách khách đi từ quảng cáo vào landing page, tạo lead, được xử lý trong CRM và được hỗ trợ bởi dữ liệu nội bộ, automation và AI.</text>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="88" y="184" width="1504" height="92" rx="28" fill="#FFFFFF" stroke="#DCE5E0"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="120" y="204" width="140" height="48" rx="18" fill="#EAF0FF"/><text x="164" y="235" fill="#315DA3" font-size="18" font-weight="700">Khách hàng</text>
    <rect x="318" y="204" width="120" height="48" rx="18" fill="#FFF0D9"/><text x="355" y="235" fill="#9C5D11" font-size="18" font-weight="700">Ads</text>
    <rect x="486" y="204" width="170" height="48" rx="18" fill="#E9F5EF"/><text x="523" y="235" fill="#2F6B57" font-size="18" font-weight="700">Landing Page</text>
    <rect x="704" y="204" width="150" height="48" rx="18" fill="#F3ECFF"/><text x="739" y="235" fill="#7353B2" font-size="18" font-weight="700">Lead DB</text>
    <rect x="902" y="204" width="120" height="48" rx="18" fill="#EAF0FF"/><text x="939" y="235" fill="#315DA3" font-size="18" font-weight="700">CRM</text>
    <rect x="1070" y="204" width="120" height="48" rx="18" fill="#FCE7EC"/><text x="1109" y="235" fill="#AF4562" font-size="18" font-weight="700">RAG</text>
    <rect x="1238" y="204" width="120" height="48" rx="18" fill="#E9F5EF"/><text x="1276" y="235" fill="#2F6B57" font-size="18" font-weight="700">n8n</text>
    <rect x="1406" y="204" width="150" height="48" rx="18" fill="#274841"/><text x="1448" y="235" fill="#E5F1ED" font-size="18" font-weight="700">AI Bot</text>
  </g>

  <g stroke="#B7C6C2" stroke-width="2" stroke-dasharray="8 8">
    <line x1="190" y1="276" x2="190" y2="860"/>
    <line x1="378" y1="276" x2="378" y2="860"/>
    <line x1="571" y1="276" x2="571" y2="860"/>
    <line x1="779" y1="276" x2="779" y2="860"/>
    <line x1="962" y1="276" x2="962" y2="860"/>
    <line x1="1130" y1="276" x2="1130" y2="860"/>
    <line x1="1298" y1="276" x2="1298" y2="860"/>
    <line x1="1481" y1="276" x2="1481" y2="860"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <rect x="96" y="324" width="1488" height="68" rx="18" fill="#FFFFFF" stroke="#E3E8E5"/>
    <text x="128" y="366" fill="#17332D" font-weight="700">1. Thu hút và tiếp cận</text>
    <line x1="210" y1="344" x2="358" y2="344" stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="232" y="332" fill="#5B6D69">Nhìn thấy quảng cáo</text>
    <line x1="398" y1="364" x2="551" y2="364" stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="432" y="352" fill="#5B6D69">Đi vào landing page</text>

    <rect x="96" y="438" width="1488" height="90" rx="18" fill="#FFFFFF" stroke="#E3E8E5"/>
    <text x="128" y="480" fill="#17332D" font-weight="700">2. Tạo lead và lưu dữ liệu</text>
    <line x1="591" y1="458" x2="759" y2="458" stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="620" y="446" fill="#5B6D69">Điền form / gửi thông tin</text>
    <line x1="789" y1="498" x2="942" y2="498" stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="828" y="486" fill="#5B6D69">Tạo lead cho CRM</text>

    <rect x="96" y="574" width="1488" height="118" rx="18" fill="#FFFFFF" stroke="#E3E8E5"/>
    <text x="128" y="616" fill="#17332D" font-weight="700">3. Sale / CS tra cứu và xử lý</text>
    <line x1="982" y1="634" x2="1110" y2="634" stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1000" y="622" fill="#5B6D69">Tra cứu thông tin tour, bảo hiểm, chính sách</text>
    <line x1="1110" y1="666" x2="982" y2="666" stroke="#AF4562" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="995" y="690" fill="#5B6D69">Trả tri thức nội bộ cho sale / CS</text>

    <rect x="96" y="738" width="1488" height="120" rx="18" fill="#17332D"/>
    <text x="128" y="780" fill="#FFFFFF" font-weight="700">4. Tự động hóa và hỗ trợ khách hàng</text>
    <line x1="789" y1="796" x2="1278" y2="796" stroke="#E5F1ED" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="936" y="784" fill="#D8E7E2">Lead / CRM kích hoạt workflow</text>
    <line x1="1318" y1="826" x2="1461" y2="826" stroke="#E5F1ED" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1340" y="814" fill="#D8E7E2">Gọi AI bot</text>
    <line x1="1451" y1="848" x2="210" y2="848" stroke="#E5F1ED" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="830" y="872" fill="#D8E7E2">Phản hồi bước đầu / thu thêm thông tin / hỗ trợ khách</text>
  </g>
</svg>

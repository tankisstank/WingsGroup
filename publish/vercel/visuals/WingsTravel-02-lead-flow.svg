<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#F9FBF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="72" y="88" fill="#162D4B" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Luồng nhận lead và xử lý ban đầu</text>
  <text x="72" y="126" fill="#4A617E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Sơ đồ này giúp giải thích vì sao landing page chỉ là điểm đầu, còn giá trị thật nằm ở luồng nhận, phản hồi và theo dõi lead.</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="230" width="220" height="130" rx="24" fill="#E7F0FF" stroke="#C9DAFF"/>
    <text x="126" y="282" fill="#214F9A" font-size="22" font-weight="700">Nguồn vào</text>
    <text x="126" y="320" fill="#47658B" font-size="18">Ads</text>
    <text x="180" y="320" fill="#47658B" font-size="18">Facebook</text>
    <text x="280" y="320" fill="#47658B" font-size="18">SEO</text>
    <text x="126" y="348" fill="#47658B" font-size="18">Đối tác</text>

    <rect x="390" y="230" width="260" height="130" rx="24" fill="#FFFFFF" stroke="#D7E0EA"/>
    <text x="434" y="282" fill="#16324F" font-size="22" font-weight="700">Landing page</text>
    <text x="434" y="320" fill="#4C6277" font-size="18">Giới thiệu dịch vụ</text>
    <text x="434" y="348" fill="#4C6277" font-size="18">Nội dung bán hàng ban đầu</text>

    <rect x="730" y="230" width="260" height="130" rx="24" fill="#F1FBF5" stroke="#D4E8DB"/>
    <text x="774" y="282" fill="#20583F" font-size="22" font-weight="700">Điểm nhận lead</text>
    <text x="774" y="320" fill="#4E6B60" font-size="18">Form</text>
    <text x="824" y="320" fill="#4E6B60" font-size="18">Chatbot</text>
    <text x="918" y="320" fill="#4E6B60" font-size="18">Hotline</text>
    <text x="774" y="348" fill="#4E6B60" font-size="18">Zalo / Email</text>

    <rect x="1070" y="230" width="240" height="130" rx="24" fill="#FFF6E7" stroke="#F0DEB8"/>
    <text x="1112" y="282" fill="#8A5A06" font-size="22" font-weight="700">Theo dõi lead</text>
    <text x="1112" y="320" fill="#7A6240" font-size="18">Google Sheet</text>
    <text x="1112" y="348" fill="#7A6240" font-size="18">CRM đơn giản</text>

    <rect x="390" y="500" width="260" height="130" rx="24" fill="#FFF0F0" stroke="#F2D3D3"/>
    <text x="435" y="552" fill="#8F3C3C" font-size="22" font-weight="700">Sales / CS</text>
    <text x="435" y="590" fill="#7B5A5A" font-size="18">Tiếp nhận</text>
    <text x="520" y="590" fill="#7B5A5A" font-size="18">Tư vấn</text>
    <text x="596" y="590" fill="#7B5A5A" font-size="18">Follow-up</text>

    <rect x="760" y="500" width="330" height="130" rx="24" fill="#F6F1FF" stroke="#DED4F2"/>
    <text x="806" y="552" fill="#5C4298" font-size="22" font-weight="700">AI và tự động hóa giai đoạn sau</text>
    <text x="806" y="590" fill="#6C6290" font-size="18">Phản hồi bước đầu</text>
    <text x="806" y="618" fill="#6C6290" font-size="18">Phân loại lead</text>
  </g>

  <line x1="310" y1="295" x2="390" y2="295" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="650" y1="295" x2="730" y2="295" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="990" y1="295" x2="1070" y2="295" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="360" x2="860" y2="500" stroke="#2D6A4F" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="520" y1="360" x2="520" y2="500" stroke="#C2410C" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1070" y1="565" x2="650" y2="565" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="90" y="690" width="1220" height="78" rx="20" fill="#FFFFFF" stroke="#DCE4EA"/>
  <text x="128" y="738" fill="#425A70" font-family="Segoe UI, Arial, sans-serif" font-size="18">Thông điệp để trình bày: không chỉ làm landing page, mà dựng một luồng bán hàng tối thiểu có thể vận hành, đo lường và mở rộng bằng AI.</text>
</svg>

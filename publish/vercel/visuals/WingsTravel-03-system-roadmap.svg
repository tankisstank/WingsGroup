  <text x="112" y="696" fill="#4E6662" font-family="Segoe UI, Arial, sans-serif" font-size="18">Cách trình bày: đi từ thứ nhìn thấy bên ngoài tới thứ tạo năng lực vận hành bên trong; AI chỉ là lớp sau cùng, không phải điểm khởi đầu.</text>

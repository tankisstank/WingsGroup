<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="72" y="88" fill="#3D2D12" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Vai trò đối tác công nghệ / CTO thuê ngoài</text>
  <text x="72" y="126" fill="#6D5D42" font-family="Segoe UI, Arial, sans-serif" font-size="18">Sơ đồ này dùng để phân biệt vai trò của bạn với một đơn vị chỉ nhận làm website.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="210" width="1224" height="500" rx="36" fill="#FFFFFF" stroke="#E8E0D2"/>
    <rect x="140" y="268" width="1120" height="110" rx="26" fill="#FFF4DE" stroke="#F0DFC0"/>
    <rect x="140" y="418" width="1120" height="110" rx="26" fill="#EAF5FF" stroke="#D2E3F4"/>
    <rect x="140" y="568" width="1120" height="94" rx="26" fill="#EEF8F2" stroke="#D7E9DE"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="178" y="310" fill="#7A5612" font-size="24" font-weight="700">Lớp 1: Tư duy kinh doanh</text>
    <text x="178" y="346" fill="#6F624B" font-size="18">Mục tiêu tăng trưởng, cách lấy khách, cách chốt khách, ưu tiên 30 ngày đầu.</text>

    <text x="178" y="460" fill="#1F4F80" font-size="24" font-weight="700">Lớp 2: Thiết kế hệ thống số</text>
    <text x="178" y="496" fill="#5D6F82" font-size="18">Landing page, lead flow, nội dung, website, CRM đơn giản, đo lường, cấu trúc vận hành.</text>

    <text x="178" y="606" fill="#245B3E" font-size="24" font-weight="700">Lớp 3: Tối ưu và mở rộng</text>
    <text x="178" y="640" fill="#5B7166" font-size="18">Tự động hóa, AI, chatbot, hỗ trợ sales, báo cáo và cải tiến liên tục.</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="936" y="292" width="254" height="314" rx="28" fill="#163B35"/>
    <text x="972" y="346" fill="#FFFFFF" font-size="22" font-weight="700">Giá trị khác biệt</text>
    <text x="972" y="394" fill="#DCEAE7" font-size="18">• Không làm rời rạc</text>
    <text x="972" y="426" fill="#DCEAE7" font-size="18">• Hiểu bán hàng và vận hành</text>
    <text x="972" y="458" fill="#DCEAE7" font-size="18">• Có lộ trình công nghệ</text>
    <text x="972" y="490" fill="#DCEAE7" font-size="18">• Đưa AI vào đúng chỗ</text>
    <text x="972" y="522" fill="#DCEAE7" font-size="18">• Có thể follow-up dài hạn</text>
  </g>

  <text x="88" y="752" fill="#6D5D42" font-family="Segoe UI, Arial, sans-serif" font-size="18">Thông điệp chốt: không bán một website, mà bán năng lực đồng hành xây nền tảng công nghệ cho một mảng kinh doanh mới.</text>
</svg>

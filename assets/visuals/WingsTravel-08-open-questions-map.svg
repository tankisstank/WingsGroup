<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFBFF"/>
      <stop offset="1" stop-color="#F8F6EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="84" y="94" fill="#1D2E4B" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Những gì cần làm rõ trước khi đi tiếp</text>
  <text x="84" y="136" fill="#617286" font-family="Segoe UI, Arial, sans-serif" font-size="20">Sơ đồ này rất hữu ích ở cuối buổi trao đổi để khóa lại các câu hỏi còn mở mà chưa cần chốt deal hay chi phí.</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="226" width="332" height="228" rx="30" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="456" y="226" width="332" height="228" rx="30" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="824" y="226" width="332" height="228" rx="30" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="1192" y="226" width="320" height="228" rx="30" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="272" y="500" width="420" height="228" rx="30" fill="#FFF8EA" stroke="#E8D6A4"/>
    <rect x="764" y="500" width="564" height="228" rx="30" fill="#F1F7F4" stroke="#D8E6DE"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="124" y="294" fill="#1D2E4B" font-size="26" font-weight="700">Khách hàng</text>
    <text x="124" y="344" fill="#617286" font-size="20">• Nhóm khách ưu tiên số 1</text>
    <text x="124" y="378" fill="#617286" font-size="20">• Hàn, Trung hay châu Âu đi trước</text>
    <text x="124" y="412" fill="#617286" font-size="20">• Khách đoàn hay nhóm nhỏ</text>
    <text x="492" y="294" fill="#1D2E4B" font-size="26" font-weight="700">Sản phẩm</text>
    <text x="492" y="344" fill="#617286" font-size="20">• Tour / dịch vụ nào đi trước</text>
    <text x="492" y="378" fill="#617286" font-size="20">• USP của từng gói sản phẩm</text>
    <text x="492" y="412" fill="#617286" font-size="20">• Hướng nội dung cho từng tệp</text>
    <text x="860" y="294" fill="#1D2E4B" font-size="26" font-weight="700">Tài nguyên</text>
    <text x="860" y="344" fill="#617286" font-size="20">• Tên thương hiệu / domain</text>
    <text x="860" y="378" fill="#617286" font-size="20">• Ảnh, video, profile</text>
    <text x="860" y="412" fill="#617286" font-size="20">• Đối tác, tài liệu, nguồn tour</text>
    <text x="1228" y="294" fill="#1D2E4B" font-size="26" font-weight="700">Tổ chức</text>
    <text x="1228" y="344" fill="#617286" font-size="20">• Ai phối hợp trực tiếp</text>
    <text x="1228" y="378" fill="#617286" font-size="20">• Ai xử lý lead</text>
    <text x="1228" y="412" fill="#617286" font-size="20">• Ai quyết định các bước tiếp theo</text>
    <text x="308" y="568" fill="#6F561D" font-size="28" font-weight="700">Điều kiện để mở sang giai đoạn khởi động</text>
    <text x="308" y="620" fill="#7F6B42" font-size="20">• Có ít nhất 1 nhóm khách ưu tiên</text>
    <text x="308" y="654" fill="#7F6B42" font-size="20">• Có ít nhất 1 sản phẩm / tour đi trước</text>
    <text x="308" y="688" fill="#7F6B42" font-size="20">• Có đầu mối tiếp nhận lead / phản hồi</text>
    <text x="800" y="568" fill="#17332D" font-size="28" font-weight="700">Ý nghĩa của phần này</text>
    <text x="800" y="620" fill="#5B6D69" font-size="20">• Giúp buổi trao đổi không bị trôi sang chuyện “làm gì cũng được”</text>
    <text x="800" y="654" fill="#5B6D69" font-size="20">• Tạo cơ sở để về sau mới bàn proposal, phạm vi hoặc chi phí</text>
    <text x="800" y="688" fill="#5B6D69" font-size="20">• Khóa lại các câu hỏi mở mà hai bên cần tiếp tục làm rõ</text>
  </g>
</svg>

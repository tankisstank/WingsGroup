  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="84" y="92" fill="#17332D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Kiến trúc hệ thống WingsTravel theo các tầng</text>
  <text x="84" y="132" fill="#5B6D69" font-family="Segoe UI, Arial, sans-serif" font-size="20">Website và landing page là lớp ngoài. Giá trị dài hạn nằm ở lead, dữ liệu, vận hành và automation phía sau.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="194" width="1432" height="122" rx="28" fill="#FFFFFF" stroke="#DCE5E0"/>
    <rect x="84" y="348" width="1432" height="148" rx="28" fill="#FFFFFF" stroke="#DCE5E0"/>
    <rect x="84" y="528" width="1432" height="132" rx="28" fill="#FFFFFF" stroke="#DCE5E0"/>
    <rect x="84" y="692" width="1432" height="138" rx="28" fill="#17332D"/>
  </g>


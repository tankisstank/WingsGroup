    <rect x="276" y="220" width="240" height="64" rx="20" fill="#EAF0FF"/><text x="316" y="260" fill="#315DA3" font-size="20" font-weight="700">Website đa ngôn ngữ</text>
    <rect x="548" y="220" width="300" height="64" rx="20" fill="#E9F5EF"/><text x="592" y="260" fill="#2F6B57" font-size="20" font-weight="700">Landing Page theo tệp khách</text>
    <rect x="880" y="220" width="260" height="64" rx="20" fill="#FFF0D9"/><text x="934" y="260" fill="#9C5D11" font-size="20" font-weight="700">Thông tin tour / dịch vụ</text>
    <rect x="1172" y="220" width="280" height="64" rx="20" fill="#FCE7EC"/><text x="1230" y="260" fill="#AF4562" font-size="20" font-weight="700">Facebook / Google Ads</text>

    <text x="116" y="388" fill="#17332D" font-size="26" font-weight="700">Tầng Backend</text>
    <rect x="250" y="380" width="180" height="74" rx="20" fill="#EAF0FF"/><text x="314" y="424" fill="#315DA3" font-size="20" font-weight="700">CRM</text>
    <rect x="462" y="380" width="180" height="74" rx="20" fill="#E9F5EF"/><text x="526" y="424" fill="#2F6B57" font-size="20" font-weight="700">RAG</text>
    <rect x="674" y="380" width="180" height="74" rx="20" fill="#FFF0D9"/><text x="735" y="424" fill="#9C5D11" font-size="20" font-weight="700">CMS</text>
    <rect x="886" y="380" width="280" height="74" rx="20" fill="#FCE7EC"/><text x="940" y="424" fill="#AF4562" font-size="20" font-weight="700">Vận hành / nội bộ</text>
    <rect x="1198" y="380" width="220" height="74" rx="20" fill="#F3ECFF"/><text x="1244" y="424" fill="#7353B2" font-size="20" font-weight="700">Quản lý lead</text>

    <text x="116" y="568" fill="#17332D" font-size="26" font-weight="700">Tầng Dữ liệu</text>
    <rect x="246" y="556" width="200" height="64" rx="20" fill="#EAF0FF"/><text x="283" y="596" fill="#315DA3" font-size="20" font-weight="700">Kho tri thức RAG</text>
    <rect x="478" y="556" width="180" height="64" rx="20" fill="#E9F5EF"/><text x="532" y="596" fill="#2F6B57" font-size="20" font-weight="700">DB Lead</text>
    <rect x="690" y="556" width="220" height="64" rx="20" fill="#FFF0D9"/><text x="735" y="596" fill="#9C5D11" font-size="20" font-weight="700">DB Khách hàng</text>
    <rect x="942" y="556" width="200" height="64" rx="20" fill="#FCE7EC"/><text x="989" y="596" fill="#AF4562" font-size="20" font-weight="700">DB Đối tác</text>
    <rect x="1174" y="556" width="220" height="64" rx="20" fill="#F3ECFF"/><text x="1224" y="596" fill="#7353B2" font-size="20" font-weight="700">DB Dịch vụ</text>

    <text x="116" y="732" fill="#FFFFFF" font-size="26" font-weight="700">Tầng Tự động hóa</text>
    <rect x="292" y="720" width="220" height="72" rx="20" fill="#274841"/><text x="362" y="763" fill="#E5F1ED" font-size="20" font-weight="700">n8n</text>
    <rect x="560" y="720" width="250" height="72" rx="20" fill="#34564E"/><text x="618" y="763" fill="#E5F1ED" font-size="20" font-weight="700">AI Bot Chat</text>
    <rect x="858" y="720" width="340" height="72" rx="20" fill="#456860"/><text x="923" y="763" fill="#E5F1ED" font-size="20" font-weight="700">Workflow / giao việc AI</text>

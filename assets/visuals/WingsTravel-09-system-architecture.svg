  <g stroke="#2F6B57" stroke-width="4" marker-end="url(#arrow)">
    <line x1="698" y1="284" x2="698" y2="380"/>
    <line x1="1308" y1="284" x2="1308" y2="380"/>
    <line x1="1308" y1="454" x2="1308" y2="556"/>
    <line x1="552" y1="454" x2="346" y2="556"/>
    <line x1="552" y1="454" x2="568" y2="556"/>
    <line x1="1026" y1="454" x2="1042" y2="556"/>
    <line x1="1284" y1="620" x2="1284" y2="720"/>
    <line x1="568" y1="620" x2="402" y2="720"/>
  </g>

  <rect x="84" y="864" width="1432" height="74" rx="22" fill="#FFFFFF" stroke="#DCE5E0"/>
  <text x="120" y="910" fill="#5B6D69" font-family="Segoe UI, Arial, sans-serif" font-size="20">Khách hàng và agency đi vào qua quảng cáo, landing page và website. Lead đi vào backend và database. Dữ liệu nội bộ nuôi RAG. Automation và AI bot dùng dữ liệu đó để hỗ trợ sale, CS và vận hành.</text>

server {
    listen 80;
    server_name wingsgroup.vn www.wingsgroup.vn wingsgo.vn www.wingsgo.vn wingside.vn www.wingside.vn wingsplus.vn www.wingsplus.vn wingspass.wingsgroup.vn wingscare.wingsgroup.vn;

    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;

    if ($query_string ~* "(^|&)(site|siteAlias)(=|%3d)") {
        return 400;
    }

    location ^~ /next/seed {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Shared aaPanel proxy caching strips Range and omits the tenant from its default key.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the trusted production edge. It overwrites these internal
        # context headers so the app can safely scope lead submissions.
        proxy_set_header X-Site-Code "";
        proxy_set_header X-Site-Code-Source "";
        proxy_set_header X-Site-Context-Source "proxy";
        proxy_set_header X-Site-Host $host;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Site-Prefix "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name wings.168.110.212.116.nip.io;

    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;

    if ($query_string ~* "(^|&)(site|siteAlias)(=|%3d)") {
        return 400;
    }

    location ^~ /next/seed {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Site-Code "";
        proxy_set_header X-Site-Code-Source "";
        proxy_set_header X-Site-Context-Source "";
        proxy_set_header X-Site-Host "";
        proxy_set_header X-Site-Prefix "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
